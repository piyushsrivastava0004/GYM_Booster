server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: gym-management-system
  profiles:
    active: dev

  datasource:
    url: jdbc:h2:file:./data/gymdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    driver-class-name: org.h2.Driver
    username: sa
    password: password
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          batch_size: 50
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: true

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${SMTP_USERNAME:notifications@gymmanagement.in}
    password: ${SMTP_PASSWORD:secretpassword}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

app:
  jwt:
    secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
    expiration-ms: 86400000 # 24 hours
  razorpay:
    key-id: ${RAZORPAY_KEY_ID:rzp_test_mockKey12345}
    key-secret: ${RAZORPAY_KEY_SECRET:secretMockRazorpaySecret987}
    webhook-secret: ${RAZORPAY_WEBHOOK_SECRET:webhookSecretRazorpay123}
    currency: INR
  storage:
    upload-dir: ./uploads
  currency: INR
  timezone: Asia/Kolkata
  tax:
    gst-rate: 18.0

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
